<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>词汇墙 · HSK Word Wall</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c3272b">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --paper:#fbfbf7; --panel:#ffffff; --ink:#1b1d21; --ink2:#5c6167; --faint:#a7abb1;
    --rule:#e4e3dc; --seal:#c3272b; --seal-soft:#f6e3e2; --focus:#2b5fb8;
    --chip-r:6px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#17181a; --panel:#202225; --ink:#eceae4; --ink2:#a3a7ad; --faint:#6b7076;
           --rule:#33363a; --seal:#e05a52; --seal-soft:#3a2422; }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",system-ui,sans-serif;
    font-size:15px; line-height:1.5;
  }
  header{
    position:sticky; top:0; z-index:20; background:var(--paper);
    border-bottom:1px solid var(--rule); padding:10px 16px 8px;
  }
  .bar{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; max-width:1200px; margin:0 auto;}
  h1{font-size:20px; margin:0; font-weight:700; letter-spacing:.5px}
  h1 small{font-weight:400; color:var(--ink2); font-size:13px; margin-left:8px}
  .progress{flex:1; min-width:180px; display:flex; align-items:center; gap:10px}
  .track{flex:1; height:6px; background:var(--rule); border-radius:3px; overflow:hidden}
  .fill{height:100%; width:0%; background:var(--seal); border-radius:3px; transition:width .3s}
  #pct{font-variant-numeric:tabular-nums; color:var(--ink2); font-size:13px; white-space:nowrap}
  .controls{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; max-width:1200px; margin-left:auto; margin-right:auto; align-items:center}
  input[type=search]{
    flex:1; min-width:160px; padding:6px 10px; border:1px solid var(--rule); border-radius:8px;
    background:var(--panel); color:var(--ink); font-size:15px;
  }
  input[type=search]:focus{outline:2px solid var(--focus); outline-offset:1px}
  .seg{display:flex; border:1px solid var(--rule); border-radius:8px; overflow:hidden}
  .seg button{
    border:0; background:var(--panel); color:var(--ink2); padding:6px 12px; cursor:pointer; font-size:13px;
  }
  .seg button[aria-pressed=true]{background:var(--ink); color:var(--paper)}
  .seg button:focus-visible{outline:2px solid var(--focus); outline-offset:-2px}
  .lvlnav{display:flex; gap:4px; flex-wrap:wrap}
  .lvlnav a{
    text-decoration:none; color:var(--ink2); font-size:12px; padding:4px 8px;
    border:1px solid var(--rule); border-radius:6px; background:var(--panel)
  }
  .lvlnav a:hover{color:var(--ink)}
  main{max-width:1200px; margin:0 auto; padding:8px 16px 60vh}
  section{margin-top:22px}
  .lvlhead{
    display:flex; align-items:baseline; gap:12px; border-bottom:2px solid var(--ink);
    padding-bottom:4px; margin-bottom:10px;
  }
  .lvlhead h2{margin:0; font-size:17px}
  .lvlhead .count{color:var(--ink2); font-size:13px; font-variant-numeric:tabular-nums}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(86px,1fr)); gap:0;
    border-left:1px solid var(--rule); border-top:1px solid var(--rule)}
  .chip{
    position:relative; border:0; border-right:1px solid var(--rule); border-bottom:1px solid var(--rule);
    background:var(--panel); color:var(--ink); border-radius:0;
    min-height:52px; display:flex; align-items:center; justify-content:center;
    padding:4px 6px; font-size:17px; cursor:pointer; line-height:1.3; user-select:none;
    text-align:center; overflow-wrap:anywhere;
  }
  .chip:hover{background:var(--paper)}
  .chip:focus-visible{outline:2px solid var(--focus); outline-offset:1px}
  .chip.known{color:var(--faint); background:transparent}
  .chip.known::after{
    content:""; position:absolute; left:10px; right:10px; top:50%;
    border-top:2px solid var(--seal); opacity:.85; transform:rotate(-4deg);
  }
  .chip.sel{box-shadow:inset 0 0 0 2px var(--seal)}
  .hidden{display:none !important}
  /* detail sheet */
  #sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--panel);
    border-top:1px solid var(--rule); box-shadow:0 -8px 30px rgba(0,0,0,.12);
    transform:translateY(105%); transition:transform .22s ease; max-height:70vh; overflow:auto;
  }
  #sheet.open{transform:translateY(0)}
  .sheet-in{max-width:760px; margin:0 auto; padding:18px 20px 26px}
  .sheet-top{display:flex; align-items:flex-start; gap:16px}
  .bigword{font-size:44px; line-height:1.15; font-weight:600; margin:0}
  .bigword.knownw{text-decoration:line-through; text-decoration-color:var(--seal); text-decoration-thickness:3px; color:var(--faint)}
  .py{font-size:19px; color:var(--seal); margin:2px 0 0; font-weight:500}
  .lvltag{margin-left:auto; font-size:12px; color:var(--ink2); border:1px solid var(--rule); border-radius:6px; padding:2px 8px; white-space:nowrap}
  .defs{margin:12px 0 0; padding:0; list-style:none}
  .defs li{padding:3px 0; border-bottom:1px dashed var(--rule); color:var(--ink)}
  .defs li:last-child{border-bottom:0}
  .exh{margin:14px 0 6px; font-size:13px; color:var(--ink2)}
  .exwords{display:flex; flex-wrap:wrap; gap:6px}
  .exwords button{
    border:1px solid var(--rule); background:var(--paper); color:var(--ink); border-radius:6px;
    padding:4px 8px; font-size:15px; cursor:pointer;
  }
  table.break{border-collapse:collapse; width:100%}
  table.break td{padding:4px 8px 4px 0; border-bottom:1px dashed var(--rule); vertical-align:top}
  table.break td.h{font-size:20px; width:2.2em}
  table.break td.p{color:var(--seal); white-space:nowrap; width:7em}
  table.break td.g{color:var(--ink2)}
  .actions{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; align-items:center}
  .btn{
    border:1px solid var(--ink); background:var(--ink); color:var(--paper);
    border-radius:8px; padding:8px 16px; font-size:15px; cursor:pointer;
  }
  .btn.ghost{background:transparent; color:var(--ink)}
  .btn:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
  .mdbg{font-size:13px; color:var(--ink2); margin-left:auto}
  .mdbg a{color:inherit}
  #closer{position:absolute; top:10px; right:14px; border:0; background:none; font-size:22px; color:var(--ink2); cursor:pointer}
  footer{border-top:1px solid var(--rule); margin-top:40px; padding:14px 16px; color:var(--ink2); font-size:13px}
  .footin{max-width:1200px; margin:0 auto; display:flex; gap:14px; flex-wrap:wrap; align-items:center}
  .linklike{border:0; background:none; color:var(--ink2); text-decoration:underline; cursor:pointer; font-size:13px; padding:0}
  #syncdlg{border:1px solid var(--rule); border-radius:12px; background:var(--panel); color:var(--ink); padding:0; max-width:460px; width:calc(100% - 32px)}
  #syncdlg::backdrop{background:rgba(0,0,0,.35)}
  .syncin{padding:18px 20px}
  @media (max-width:600px){
    .bigword{font-size:34px}
    .grid{grid-template-columns:repeat(auto-fill, minmax(72px,1fr))}
    .chip{font-size:15px; min-height:46px}
  }
  @media (prefers-reduced-motion: reduce){ #sheet{transition:none} html{scroll-behavior:auto} }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>词汇墙<small>HSK 1–3 word wall</small></h1>
    <div class="progress"><div class="track"><div class="fill" id="fill"></div></div><span id="pct">0 / 0</span></div>
  </div>
  <div class="controls">
    <input id="q" type="search" placeholder="Search 汉字, pinyin, or English" autocomplete="off">
    <div class="seg" role="group" aria-label="Filter">
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="todo" aria-pressed="false">To learn</button>
      <button data-f="known" aria-pressed="false">Known</button>
    </div>
    <nav class="lvlnav" id="lvlnav"></nav>
  </div>
</header>

<main id="main"></main>

<div id="sheet" role="dialog" aria-modal="false" aria-label="Word details">
  <div class="sheet-in">
    <button id="closer" aria-label="Close">×</button>
    <div class="sheet-top">
      <div>
        <p class="bigword" id="dw"></p>
        <p class="py" id="dp"></p>
      </div>
      <span class="lvltag" id="dl"></span>
    </div>
    <ul class="defs" id="dd"></ul>
    <div id="dx"></div>
    <div class="actions">
      <button class="btn" id="toggleKnown">I know this ✓</button>
      <span class="mdbg">Example sentences: <a id="mdbg" href="#" target="_blank" rel="noopener">MDBG</a> · <a id="tato" href="#" target="_blank" rel="noopener">Tatoeba</a></span>
    </div>
  </div>
</div>

<footer><div class="footin">
  <span id="stats"></span>
  <button class="linklike" id="exp">Export progress</button>
  <label class="linklike" style="cursor:pointer">Import progress<input type="file" id="imp" accept=".json" style="display:none"></label>
  <button class="linklike" id="reset">Reset all</button>
  <button class="linklike" id="syncbtn">Sync across devices</button>
  <span id="syncstat" style="margin-left:auto"></span>
</div></footer>
<dialog id="syncdlg">
  <form method="dialog" class="syncin">
    <h3 style="margin:0 0 6px">Sync via GitHub Gist</h3>
    <p class="exh" style="margin:0 0 10px">Paste a fine-grained GitHub token with <b>Gists: read and write</b>. It is stored only in this browser. Your progress is saved to a secret Gist and pulled on every device that has the same token.</p>
    <input id="tok" type="password" placeholder="github_pat_…" autocomplete="off" style="width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);font-size:14px">
    <p id="syncmsg" class="exh" style="min-height:1.2em"></p>
    <div class="actions" style="margin-top:8px">
      <button class="btn" id="syncsave" type="button">Save &amp; sync</button>
      <button class="btn ghost" id="syncoff" type="button">Disconnect</button>
      <button class="btn ghost" type="submit" style="margin-left:auto">Close</button>
    </div>
  </form>
</dialog>

const LKEY = 'hskwall.known.v1';
let known = new Set(JSON.parse(localStorage.getItem(LKEY)||'[]'));
const save = ()=>{ localStorage.setItem(LKEY, JSON.stringify([...known])); if(typeof syncPush==='function') syncPush(); };

const LVL = {1:'HSK 1',2:'HSK 2',3:'HSK 3',4:'HSK 4',5:'HSK 5',6:'HSK 6',0:'Extra'};
const order = [1,2,3,4,5,6,0];
const byLvl = {}; order.forEach(l=>byLvl[l]=[]);
DATA.forEach((e,i)=>{ e.i=i; e.pl=e.p.toLowerCase(); e.dl=e.d.join(' ').toLowerCase(); (byLvl[e.l]??byLvl[0]).push(e); });

const main = document.getElementById('main');
const nav = document.getElementById('lvlnav');
const chips = new Array(DATA.length);
order.forEach(l=>{
  const list = byLvl[l]; if(!list.length) return;
  const sec = document.createElement('section'); sec.id = 'lvl'+l;
  sec.innerHTML = `<div class="lvlhead"><h2>${LVL[l]}</h2><span class="count" id="c${l}"></span></div>`;
  const g = document.createElement('div'); g.className='grid';
  list.forEach(e=>{
    const b = document.createElement('button');
    b.className='chip'; b.textContent=e.w; b.dataset.i=e.i;
    if(known.has(e.w)) b.classList.add('known');
    g.appendChild(b); chips[e.i]=b;
  });
  sec.appendChild(g); main.appendChild(sec);
  const a=document.createElement('a'); a.href='#lvl'+l; a.textContent=LVL[l]; nav.appendChild(a);
});

let cur=null, filter='all';
const sheet=document.getElementById('sheet');
const $=id=>document.getElementById(id);

function openWord(e){
  cur=e;
  document.querySelectorAll('.chip.sel').forEach(c=>c.classList.remove('sel'));
  chips[e.i].classList.add('sel');
  $('dw').textContent=e.w;
  $('dw').classList.toggle('knownw', known.has(e.w));
  $('dp').textContent=e.p;
  $('dl').textContent=LVL[e.l];
  $('dd').innerHTML=e.d.map(d=>`<li>${esc(d)}</li>`).join('');
  const dx=$('dx');
  if(e.x && e.x.length){
    dx.innerHTML=`<p class="exh">Appears in these words — tap to jump:</p><div class="exwords">`+
      e.x.map(w=>`<button data-w="${w}">${w}</button>`).join('')+`</div>`;
  } else if(e.b){
    dx.innerHTML=`<p class="exh">Character by character:</p><table class="break">`+
      e.b.map(r=>`<tr><td class="h">${r[0]}</td><td class="p">${r[1]}</td><td class="g">${esc(r[2])}</td></tr>`).join('')+`</table>`;
  } else dx.innerHTML='';
  $('toggleKnown').textContent = known.has(e.w) ? 'Still learning ↺' : 'I know this ✓';
  $('mdbg').href='https://www.mdbg.net/chinese/dictionary?wdqb='+encodeURIComponent(e.w);
  $('tato').href='https://tatoeba.org/en/sentences/search?from=cmn&to=eng&query='+encodeURIComponent(e.w);
  sheet.classList.add('open');
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function closeSheet(){sheet.classList.remove('open'); document.querySelectorAll('.chip.sel').forEach(c=>c.classList.remove('sel')); cur=null;}
$('closer').onclick=closeSheet;
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeSheet()});

main.addEventListener('click',ev=>{
  const c=ev.target.closest('.chip'); if(!c) return;
  openWord(DATA[+c.dataset.i]);
});
$('dx').addEventListener('click',ev=>{
  const b=ev.target.closest('button[data-w]'); if(!b) return;
  const e=DATA.find(x=>x.w===b.dataset.w); if(e) openWord(e);
});
$('toggleKnown').onclick=()=>{
  if(!cur) return;
  if(known.has(cur.w)) known.delete(cur.w); else known.add(cur.w);
  save();
  chips[cur.i].classList.toggle('known', known.has(cur.w));
  $('dw').classList.toggle('knownw', known.has(cur.w));
  $('toggleKnown').textContent = known.has(cur.w) ? 'Still learning ↺' : 'I know this ✓';
  refresh(false);
};

/* search + filter */
const q=$('q');
q.addEventListener('input',()=>refresh(true));
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
  filter=b.dataset.f;
  document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed', x===b));
  refresh(true);
});
function refresh(applyVis){
  const term=q.value.trim().toLowerCase();
  let shown={}; order.forEach(l=>shown[l]=0);
  if(applyVis){
    DATA.forEach(e=>{
      const k=known.has(e.w);
      let vis = filter==='all' || (filter==='known'&&k) || (filter==='todo'&&!k);
      if(vis && term) vis = e.w.includes(term) || e.pl.includes(term) || e.pl.replace(/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/g, m=>'aaaaeeeeiiiioooouuuuüüüü'['āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ'.indexOf(m)]).includes(term) || e.dl.includes(term);
      chips[e.i].classList.toggle('hidden', !vis);
      if(vis) shown[e.l]++;
    });
  } else {
    DATA.forEach(e=>{ if(!chips[e.i].classList.contains('hidden')) shown[e.l]++; });
  }
  order.forEach(l=>{
    const c=document.getElementById('c'+l); if(!c) return;
    const kn=byLvl[l].filter(e=>known.has(e.w)).length;
    c.textContent=`${kn} / ${byLvl[l].length} known` + (applyVis && (q.value||filter!=='all') ? ` · ${shown[l]} shown` : '');
    document.getElementById('lvl'+l).classList.toggle('hidden', shown[l]===0 && (q.value||filter!=='all'));
  });
  const tot=DATA.length, kn=known.size;
  $('fill').style.width=(100*kn/tot).toFixed(1)+'%';
  $('pct').textContent=`${kn} / ${tot} known`;
  $('stats').textContent=`${tot} words · progress saved in this browser${localStorage.getItem('hskwall.gist.token')?' · synced via Gist':''}`;
}
refresh(true);

/* export / import / reset */
$('exp').onclick=()=>{
  const blob=new Blob([JSON.stringify([...known])],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='hsk-known-words.json'; a.click(); URL.revokeObjectURL(a.href);
};
$('imp').addEventListener('change',ev=>{
  const f=ev.target.files[0]; if(!f) return;
  f.text().then(t=>{
    try{ const arr=JSON.parse(t); if(Array.isArray(arr)){ known=new Set(arr); save();
      DATA.forEach(e=>chips[e.i].classList.toggle('known', known.has(e.w))); refresh(true);} }
    catch(e){ alert('That file could not be read as progress data.'); }
  });
});
$('reset').onclick=()=>{
  if(confirm('Clear all known-word marks?')){ known.clear(); save();
    DATA.forEach(e=>chips[e.i].classList.remove('known')); refresh(true); }
};

/* ---- GitHub Gist sync ---- */
const TKEY='hskwall.gist.token', GKEY='hskwall.gist.id', DKEY='hskwall.gist.dirty', FNAME='hsk-known-words.json';
const gtok=()=>localStorage.getItem(TKEY)||'';
const gstat=(t,err)=>{ const el=$('syncstat'); el.textContent=t; el.style.color=err?'var(--seal)':''; };
const gmsg=(t,err)=>{ const el=$('syncmsg'); el.textContent=t; el.style.color=err?'var(--seal)':''; };
async function gh(path,opt={}){
  const r=await fetch('https://api.github.com'+path,{...opt,headers:{'Authorization':'Bearer '+gtok(),'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}});
  if(!r.ok){ const e=new Error('GitHub '+r.status); e.status=r.status; throw e; }
  return r.status===204?null:r.json();
}
async function findGist(){
  let id=localStorage.getItem(GKEY);
  if(id){ try{ await gh('/gists/'+id); return id; }catch(e){ if(e.status!==404) throw e; } }
  const list=await gh('/gists?per_page=100');
  const g=list.find(x=>x.files && x.files[FNAME]);
  if(g){ localStorage.setItem(GKEY,g.id); return g.id; }
  const made=await gh('/gists',{method:'POST',body:JSON.stringify({description:'HSK word wall progress',public:false,files:{[FNAME]:{content:JSON.stringify({known:[...known],updated:Date.now()})}}})});
  localStorage.setItem(GKEY,made.id); return made.id;
}
function applyKnown(arr){
  known=new Set(arr);
  localStorage.setItem(LKEY, JSON.stringify([...known]));
  DATA.forEach(e=>chips[e.i].classList.toggle('known', known.has(e.w)));
  if(cur){ $('dw').classList.toggle('knownw', known.has(cur.w)); $('toggleKnown').textContent = known.has(cur.w) ? 'Still learning ↺' : 'I know this ✓'; }
  refresh(true);
}
let pushTimer=null, pushing=false;
function syncPush(){
  if(!gtok()) return;
  localStorage.setItem(DKEY,'1');
  clearTimeout(pushTimer); pushTimer=setTimeout(doPush,1500);
}
async function doPush(){
  if(!gtok()||pushing) return; pushing=true;
  try{
    const id=await findGist();
    await gh('/gists/'+id,{method:'PATCH',body:JSON.stringify({files:{[FNAME]:{content:JSON.stringify({known:[...known],updated:Date.now()})}}})});
    localStorage.removeItem(DKEY); gstat('Synced '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}));
  }catch(e){ gstat(navigator.onLine?'Sync failed ('+e.message+')':'Offline · will sync later',true); }
  finally{ pushing=false; }
}
async function doPull(firstLink){
  if(!gtok()) return;
  try{
    gstat('Syncing…');
    if(localStorage.getItem(DKEY) && !firstLink){ await doPush(); return; }
    const id=await findGist();
    const g=await gh('/gists/'+id);
    const f=g.files[FNAME]; let data={known:[]};
    try{ data=JSON.parse(f.truncated ? await (await fetch(f.raw_url)).text() : f.content); }catch(_){}
    const remote=Array.isArray(data)?data:(data.known||[]);
    applyKnown(firstLink ? [...new Set([...remote, ...known])] : remote);
    if(firstLink) await doPush(); else gstat('Synced '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}));
  }catch(e){ gstat(e.status===401?'Sync: token invalid or expired':(navigator.onLine?'Sync failed ('+e.message+')':'Offline'),true); }
}
$('syncbtn').onclick=()=>{ $('tok').value=gtok(); gmsg(gtok()?'Connected. Paste a new token to replace it.':''); $('syncdlg').showModal(); };
$('syncsave').onclick=async()=>{
  const t=$('tok').value.trim(); if(!t){ gmsg('Paste a token first.',true); return; }
  localStorage.setItem(TKEY,t); localStorage.removeItem(GKEY);
  gmsg('Connecting…');
  try{ await gh('/user'); await doPull(true); gmsg('Connected and synced.'); }
  catch(e){ localStorage.removeItem(TKEY); gmsg(e.status===401?'Token rejected. Check it has Gists read/write.':'Could not connect ('+e.message+').',true); gstat(''); }
};
$('syncoff').onclick=()=>{ localStorage.removeItem(TKEY); localStorage.removeItem(GKEY); localStorage.removeItem(DKEY); $('tok').value=''; gmsg('Disconnected. Progress stays on this device.'); gstat(''); };
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') doPull(false); });
window.addEventListener('online',()=>doPull(false));
doPull(false);
</script>

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js');
